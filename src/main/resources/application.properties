spring.application.name=backend


server.port=8081

#DATABASE

#CADENA DE CONEXION - CONNECTION STRING
spring.datasource.url=jdbc:postgresql://localhost:5432/backend?socketTimeout=15
#change depends on database used
#spring.datasource.url=jdbc:mysql://localhost:3306/backend?socketTimeout=15

spring.datasource.driver-class-name=org.postgresql.Driver
#change depends on database used
#spring.datasource.driver-class-name=.......

spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update

